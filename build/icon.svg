<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角矩形 -->
  <rect width="1024" height="1024" rx="180" fill="#1890ff"/>

  <!-- Markdown 笔记本图标 -->
  <g transform="translate(200, 200)">
    <!-- 笔记本主体 -->
    <rect x="0" y="0" width="624" height="624" rx="40" fill="white"/>

    <!-- 笔记本装订线 -->
    <rect x="60" y="0" width="8" height="624" fill="#e8e8e8"/>
    <circle cx="64" cy="80" r="16" fill="#1890ff"/>
    <circle cx="64" cy="180" r="16" fill="#1890ff"/>
    <circle cx="64" cy="280" r="16" fill="#1890ff"/>
    <circle cx="64" cy="380" r="16" fill="#1890ff"/>
    <circle cx="64" cy="480" r="16" fill="#1890ff"/>

    <!-- 文字行 -->
    <rect x="120" y="100" width="420" height="40" rx="8" fill="#f0f0f0"/>
    <rect x="120" y="180" width="380" height="40" rx="8" fill="#f0f0f0"/>
    <rect x="120" y="260" width="440" height="40" rx="8" fill="#f0f0f0"/>

    <!-- Markdown 标志 M# -->
    <text x="120" y="400" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#1890ff">M</text>
    <text x="230" y="400" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#52c41a">#</text>
  </g>

  <!-- 编辑笔 -->
  <g transform="translate(680, 600) rotate(45)">
    <rect x="0" y="0" width="200" height="40" rx="10" fill="#faad14"/>
    <polygon points="200,0 240,20 200,40" fill="#faad14"/>
  </g>
</svg>
